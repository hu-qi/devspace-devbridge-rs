name: One-shot Rust format

on:
  push:
    branches: [refactor/rust-full-stack]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: rustfmt')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rust-full-stack
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - working-directory: cli
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli
          git commit -m "chore: rustfmt"
          git push origin HEAD:refactor/rust-full-stack
