[workspace]
resolver = "2"
members = [
  "crates/devbridge-core",
  "crates/devbridge-tunnel",
  "crates/devbridge-cli",
]
default-members = ["crates/devbridge-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hu-qi/devspace-devbridge-rs"
authors = ["DevBridge contributors"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
comfy-table = "7.2"
dirs = "6.0"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
russh = { version = "=0.37.1", default-features = false, features = ["openssl", "flate2"] }
russh-keys = { version = "=0.37.1", default-features = false, features = ["openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webbrowser = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
opt-level = "z"
panic = "abort"
